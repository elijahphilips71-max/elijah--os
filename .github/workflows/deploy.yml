# Publishes Elijah OS to GitHub Pages every time main changes.
# It publishes the same layout as "Deploy from a branch" (the app in elijah-os/, a redirect at the top),
# so whichever Pages source is set, both links work:
#   https://elijahphilips71-max.github.io/elijah--os/elijah-os/   (the app)
#   https://elijahphilips71-max.github.io/elijah--os/             (redirects to the app)
name: Deploy Elijah OS

on:
  push:
    branches: [main]
    paths: ['elijah-os/**', 'tools/**', 'index.html', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build calendar feed from the schedule
        run: node tools/make-calendar.js
      - name: Lay out the site like the repo (app in elijah-os/, redirect at the top)
        run: |
          mkdir -p _site
          cp -r elijah-os _site/elijah-os
          cp index.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
