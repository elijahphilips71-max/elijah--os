# Publishes the elijah-os folder to GitHub Pages every time main changes.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
# The link stays the same forever: https://elijahphilips71-max.github.io/elijah--os/
name: Deploy Elijah OS

on:
  push:
    branches: [main]
    paths: ['elijah-os/**', 'tools/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build calendar feed from the schedule
        run: node tools/make-calendar.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: elijah-os
      - id: deployment
        uses: actions/deploy-pages@v4
