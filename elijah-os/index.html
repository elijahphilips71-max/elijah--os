<body>
<div id="app"></div>
<noscript><p style="padding:24px;color:#e9e9ed">Elijah OS needs JavaScript turned on.</p></noscript>
<script src="js/schedule.js"></script>
<script src="js/updates.js"></script>
<script src="js/cal.js"></script>
<script src="js/planner.js"></script>
<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script>
  // Offline support, plus a "new version ready" banner when a newer build is published.
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => {
      const hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
        const check = () => reg.update().catch(() => {});
        document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
        setInterval(check, 30 * 60 * 1000);
      }).catch(() => {});
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (hadController) window.dispatchEvent(new Event('elijah-update'));
      });
    });
  }
</script>
</body>
</html>
